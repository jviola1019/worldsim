name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser smoke test (Chromium, iPhone 13 emulation + desktop)
        run: |
          npm install --no-save playwright@1.65.1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          npm run e2e
      # round 9: the same checks on WebKit (Safari's engine; emulation, not a physical iPhone)
      - name: Browser smoke test (WebKit, iPhone 13 emulation + desktop)
        run: |
          npx playwright install --with-deps webkit
          BROWSER=webkit npm run e2e
