name: Deploy to GitHub Pages

# Publishes the BUILT game (vite build → dist/) so it can be played from any browser at
# https://<owner>.github.io/<repo>/. One-time setup: Settings → Pages → Source: "GitHub Actions".
# Do not use a Jekyll/static template workflow here: the repository root holds the source
# (index.html loads /src/main.tsx), which only runs after the Vite build.
#
# Deploys happen only after CI (typecheck, unit tests, build, browser e2e) has passed on the same
# commit: this workflow runs when the CI workflow completes, and only for a successful CI run of a
# push to main or the work branch in this repository. (workflow_run triggers fire only while this
# file is on the default branch, which is the work branch.) A manual run deploys the chosen branch
# after its own unit tests and build pass.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, claude/epoch-civilizations-unbound-dap8pc]
  workflow_dispatch:

# Least privilege: the build job only reads; only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # only a green CI run of a push in this repository (never a pull request or a fork) may deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # deploy exactly the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
